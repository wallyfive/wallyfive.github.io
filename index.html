<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta tags for proper character encoding and mobile responsiveness -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brawl Stars Fan Page</title>
    <!-- Link to our external CSS stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header section styled like a game title banner -->
    <header>
        <h1>⭐ BRAWL STARS FAN ZONE ⭐</h1>
        <p>Ready for battle? Collect your trophies below!</p>
    </header>

    <!-- Main content section -->
    <main>
        <section class="card">
            <h2>Brawler Status</h2>
            <p>Click the button to battle and earn trophies for your profile!</p>
            
            <!-- Trophy counter display -->
            <div class="trophy-display">
                <span id="trophyCount">0</span> 🏆 Trophies
            </div>

            <!-- Interactive Battle Button -->
            <button id="magicBtn">Play Match!</button>
        </section>
    </main>

    <!-- Footer section -->
    <footer>
        <p>&copy; 2026 Brawler Fan. Not an official Supercell website.</p>
    </footer>

    <!-- Link to our external JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
