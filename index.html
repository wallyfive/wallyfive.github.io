<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta tags for proper character encoding and mobile responsiveness -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Awesome Website</title>
    <!-- Link to our external CSS stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header section with the main title -->
    <header>
        <h1>Welcome to My Website!</h1>
        <p>Built with HTML, CSS, and JavaScript, hosted on GitHub Pages.</p>
    </header>

    <!-- Main content section -->
    <main>
        <section class="card">
            <h2>Hello, World!</h2>
            <p>This is my personal corner of the internet. Click the button below to see JavaScript in action!</p>
            <!-- Interactive Button -->
            <button id="magicBtn">Click Me!</button>
        </section>
    </main>

    <!-- Footer section -->
    <footer>
        <p>&copy; 2026 Future Developer. All rights reserved.</p>
    </footer>

    <!-- Link to our external JavaScript file (placed at the bottom so the HTML loads first) -->
    <script src="script.js"></script>
</body>
</html>
