<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Rainbow | Tactical Briefing</title>
    <!-- Link to our external CSS stylesheet for design -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Main header section acting as a tactical command HUD -->
    <header>
        <h1>TEAM RAINBOW // COMMAND</h1>
        <p>Operator Clearance: Verified | Status: Ready for Deployment</p>
    </header>

    <!-- Main interactive content section -->
    <main>
        <section class="card">
            <h2>DEFUSER DRILL</h2>
            <p id="game-status">Status: Bomb armed. Defuse it before time runs out!</p>
            
            <!-- Tactical Minigame Display -->
            <div id="defuser-display">
                <span id="countdown">10</span>s
            </div>

            <!-- Interactive buttons for the minigame -->
            <button id="actionBtn">ARM DEFUSER</button>
            <button id="defuseBtn" class="hidden">CUT THE WIRE!</button>
        </section>
    </main>

    <!-- Link to our external JavaScript file for interactivity -->
    <script src="script.js"></script>
</body>
</html>
